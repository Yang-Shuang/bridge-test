<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebView跳转测试</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-sub: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .header {
            text-align: center;
            padding: 32px 16px 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-radius: 0 0 28px 28px;
        }

        .header h1 { font-size: 1.4rem; margin-bottom: 8px; }
        .subtitle { font-size: 0.85rem; opacity: 0.9; }

        .container { padding: 0 16px 32px; max-width: 960px; margin: 0 auto; }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            margin-top: 24px;
        }

        .test-card {
            background: var(--card-bg);
            padding: 24px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }

        .test-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(99,102,241,0.15); }
        .test-card:active { transform: scale(0.97); }

        .card-icon { font-size: 2rem; }
        .card-title { font-weight: 600; font-size: 0.95rem; }
        .card-desc {
            font-size: 0.8rem;
            color: var(--text-sub);
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .test-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🔗 WebView跳转测试</h1>
        <p class="subtitle">测试不同链接打开方式</p>
    </div>

    <main class="container">
        <div class="test-grid">
            <!-- 百度 a标签_self -->
            <a href="https://www.baidu.com" target="_self" class="test-card">
                <span class="card-icon">🌐</span>
                <div class="card-content">
                    <h3 class="card-title">百度 a标签 _self</h3>
                    <p class="card-desc">当前窗口打开</p>
                </div>
            </a>

            <!-- 百度 a标签_blank -->
            <a href="https://www.baidu.com" target="_blank" rel="noopener noreferrer" class="test-card">
                <span class="card-icon">🆕</span>
                <div class="card-content">
                    <h3 class="card-title">百度 a标签 _blank</h3>
                    <p class="card-desc">新窗口打开</p>
                </div>
            </a>

            <!-- window.location.href -->
            <button onclick="window.location.href='https://www.baidu.com';" class="test-card">
                <span class="card-icon">📍</span>
                <div class="card-content">
                    <h3 class="card-title">百度 location.href</h3>
                    <p class="card-desc">window.location.href 跳转</p>
                </div>
            </button>

            <!-- window.open -->
            <button onclick="window.open('https://www.baidu.com');" class="test-card">
                <span class="card-icon">🚪</span>
                <div class="card-content">
                    <h3 class="card-title">百度 window.open</h3>
                    <p class="card-desc">window.open 打开新页</p>
                </div>
            </button>
        </div>
    </main>

    <script>
        // JavaScript代码区域
        document.addEventListener('DOMContentLoaded', function () {
            console.log('页面已加载');
        });
    </script>
</body>

</html>
